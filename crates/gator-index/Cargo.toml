[package]
name = "gator-index"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[[bin]]
name = "gator-index"
path = "src/main.rs"
