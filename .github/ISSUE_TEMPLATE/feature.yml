name: Feature request
description: Propose a new paw capability or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Implementation details are useful after the workflow is clear.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked, slow, unsafe, or too manual today?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What should paw do differently?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include CLI workarounds, config workarounds, or other tools you tried.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, examples, traces, or screenshots if useful.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability report.
          required: true
