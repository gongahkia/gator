name: Terminal migration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: terminal-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Build and test terminal against real Go state
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix app-host
          npm test --prefix app-host
          node --test ui/scripts/install.test.mjs
          bun install --cwd ui --frozen-lockfile
          node ui/scripts/build-runtime.mjs
          bun run --cwd ui check
          bun run --cwd ui build
          if [ "$RUNNER_OS" = Windows ]; then
            export GATOR_TEST_BINARY="$(cygpath -w "$PWD/ui/runtime/gator-runtime.exe")"
          else
            export GATOR_TEST_BINARY="$PWD/ui/runtime/gator-runtime"
          fi
          node --test ui/scripts/uninstall.test.mjs
          bun run --cwd ui test
      - name: Verify native memory and local tracking lifecycle
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/memory ./internal/learning ./internal/personalization ./internal/retrieval
          go test ./internal/goal ./internal/knowledge ./internal/suggestion ./internal/followup
          go test ./internal/tools -run 'Knowledge|Suggest|MainChatPlan'
          go test ./internal/lifecycle -run 'RestorePreservesForgotten|Retention|Backup'
          # Code-agent follow-up/shell tests run in ci.yml with sandbox dependencies.
          go test ./internal/workapp -run 'Followup|Calendar'
          go test ./cmd/gator -run 'Memory|PersonalSummary|Recall|IdleMemoryMaintenance|Plan|Agenda|Suggest|AcceptNoteUpdate|GoalWatch|GoalAccess|NativeConnectionChecks|ScheduledBlock|Calendar|^Test(ChatFollowup|Reviewed.*Followup|DailyFollowup|JobCommandBindsFollowups)|ConnectedGoal'
      - name: Build independent production artifact
        run: node ui/scripts/package.mjs terminal-artifact
      - name: Verify installed lifecycle without Electron
        run: node ui/scripts/verify-install.mjs terminal-artifact
      - name: Verify installation switch and rollback
        run: bun ui/scripts/verify-upgrade.mjs terminal-artifact terminal-artifact terminal-upgrade-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-upgrade-${{ matrix.runner }}
          path: terminal-upgrade-report.json
          if-no-files-found: ignore
      - name: Verify native terminal and editor handoff
        if: runner.os != 'Windows'
        run: |
          python3 -m venv .pty-venv
          .pty-venv/bin/pip install -r ui/scripts/requirements-pty.txt
          .pty-venv/bin/python ui/scripts/verify-package.py terminal-artifact --editor --untrusted-file
      - name: Compile additional ARM64 runtime
        if: runner.os != 'macOS'
        shell: bash
        env:
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: node ui/scripts/build-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gator-terminal-${{ matrix.runner }}
          path: terminal-artifact/
