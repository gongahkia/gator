name: Release

on:
  push:
    tags: ["v*"]

  # Exercise the native release toolchains when this workflow changes.
  pull_request:
    paths:
      - .github/workflows/release.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cgo: "1"
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            cgo: "1"
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cgo: "0"
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cgo: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check bundled terminal UI
        shell: bash
        run: |
          npm ci --prefix ui
          npm run check --prefix ui
          npm run build --prefix ui
          git diff --exit-code -- cmd/gator/ui/gator-ui.cjs
      - name: Test release source on macOS
        if: runner.os == 'macOS'
        run: go test ./...
      # GitHub-hosted Linux runners cannot create Bubblewrap's network namespace.
      # Compile every test there, then build the Linux release binary below.
      - name: Compile release tests on Linux
        if: runner.os == 'Linux'
        run: go test ./... -run '^$'
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          VERSION: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          name="gator_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "dist/$name/gator" ./cmd/gator
          cp -R ui/licenses "dist/$name/terminal-ui-licenses"
          tar -C dist -czf "dist/gator_${GOOS}_${GOARCH}.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum gator_* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
