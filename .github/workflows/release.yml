name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Add Syft to PATH
        run: echo "$(dirname "${{ steps.syft.outputs.cmd }}")" >> "$GITHUB_PATH"

      - name: Check Syft
        run: syft version

      - name: Check macOS signing secrets
        run: |
          test -n "$MACOS_SIGN_P12"
          test -n "$MACOS_SIGN_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PWD"
          test -n "$MACOS_NOTARY_KEY"
          test -n "$MACOS_NOTARY_KEY_ID"
          test -n "$MACOS_NOTARY_ISSUER_ID"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-validate:
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - name: Download darwin release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/validate
          gh release download "$GITHUB_REF_NAME" --pattern "*arwin*.tar.gz" --dir dist/validate

      - name: Validate macOS signatures and Gatekeeper assessment
        run: |
          set -euo pipefail
          found=0
          for archive in dist/validate/*arwin*.tar.gz; do
            [ -e "$archive" ] || continue
            workdir="$(mktemp -d)"
            tar -xzf "$archive" -C "$workdir"
            binary="$workdir/paw"
            test -x "$binary"
            codesign -v --strict --verbose=2 "$binary"
            codesign -dv --verbose=4 "$binary"
            spctl -a -t exec -vv "$binary"
            found=1
          done
          test "$found" -eq 1
