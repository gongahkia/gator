name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Add Syft to PATH
        run: echo "$(dirname "${{ steps.syft.outputs.cmd }}")" >> "$GITHUB_PATH"

      - name: Check Syft
        run: syft version

      - name: Check macOS signing secrets
        run: |
          test -n "$MACOS_SIGN_P12"
          test -n "$MACOS_SIGN_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PWD"
          test -n "$MACOS_NOTARY_KEY"
          test -n "$MACOS_NOTARY_KEY_ID"
          test -n "$MACOS_NOTARY_ISSUER_ID"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Clone Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/gongahkia/homebrew-paw.git" ../homebrew-paw

      - name: Generate Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
          TAP_DIR: ../homebrew-paw
          DIST_DIR: dist
        run: bash .github/scripts/update-homebrew-formula.sh

      - name: Push Homebrew formula
        working-directory: ../homebrew-paw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/paw.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula unchanged"
          else
            git commit -m "Update paw to ${{ github.ref_name }}"
            git push origin main
          fi
