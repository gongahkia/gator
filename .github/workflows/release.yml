name: Release desktop

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - desktop/package.json
      - desktop/scripts/build-runtime.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            arch: arm64
            platform: mac
            runner: macos-15
            cgo: "1"
          - goos: darwin
            goarch: amd64
            arch: x64
            platform: mac
            runner: macos-15-intel
            cgo: "1"
          - goos: linux
            goarch: amd64
            arch: x64
            platform: linux
            runner: ubuntu-latest
            cgo: "0"
          - goos: linux
            goarch: arm64
            arch: arm64
            platform: linux
            runner: ubuntu-latest
            cgo: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check desktop source
        run: |
          npm ci --prefix desktop
          npm run check --prefix desktop
          npm test --prefix desktop
      - name: Test release source on macOS
        if: runner.os == 'macOS'
        run: go test ./...
      # Hosted Linux runners cannot create Bubblewrap's network namespace.
      - name: Compile release tests on Linux
        if: runner.os == 'Linux'
        run: go test ./... -run '^$'
      - name: Build desktop installers with the matching private runtime
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          COMMIT: ${{ github.sha }}
          DESKTOP_PLATFORM: ${{ matrix.platform }}
          DESKTOP_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cd desktop
          npm version --no-git-tag-version --allow-same-version "${VERSION#v}"
          npm run build
          npx electron-builder --publish never --"$DESKTOP_PLATFORM" --"$DESKTOP_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            desktop/release/Gator-*.dmg
            desktop/release/Gator-*.zip
            desktop/release/Gator-*.AppImage
            desktop/release/Gator-*.deb
          if-no-files-found: error
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create desktop checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum Gator-* > checksums.txt
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
