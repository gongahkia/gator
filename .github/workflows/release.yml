name: Release terminal

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - ui/package.json
      - ui/bun.lock
      - ui/launcher/**
      - ui/scripts/**
      - app-host/package.json
      - app-host/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: terminal-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    # Preserve the existing protected environment and its OAuth client material.
    environment: ${{ github.ref_type == 'tag' && 'desktop-release' || 'desktop-preview' }}
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      COMMIT: ${{ github.sha }}
      # Installed OAuth client material, never user credentials or a web secret.
      GATOR_GOOGLE_DESKTOP_CLIENT_ID: ${{ github.ref_type == 'tag' && vars.GOOGLE_DESKTOP_CLIENT_ID || '' }}
      GATOR_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ github.ref_type == 'tag' && secrets.GOOGLE_DESKTOP_CLIENT_SECRET || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-15 }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: windows, goarch: amd64, runner: windows-latest }
          - { goos: windows, goarch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/.bun-version
      - name: Build native terminal package
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm ci --prefix app-host
          (cd ui && bun install --frozen-lockfile)
          node ui/scripts/build-runtime.mjs
          (cd ui && bun run build)
          (cd ui && bun run check)
          node --test ui/scripts/install.test.mjs ui/scripts/uninstall.test.mjs scripts/google-oauth-build.test.mjs
          node ui/scripts/package.mjs terminal-artifact
          node ui/scripts/verify-install.mjs terminal-artifact
      - name: Archive the complete native runtime and frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf "release/gator-terminal_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" terminal-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum gator-terminal_*.tar.gz > checksums.txt
      - name: Prepare terminal release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes --verify-tag
