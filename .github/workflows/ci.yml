name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check desktop frontend and host
        run: |
          npm ci --prefix app-host
          npm ci --prefix desktop
          npm run check --prefix desktop
          npm test --prefix desktop
          node --test scripts/google-oauth-build.test.mjs
          node --test companion/auth.test.mjs companion/server.test.mjs companion/macos-service.test.mjs companion/linux-service.test.mjs companion/health.test.mjs
      - name: Check Linux companion user-service lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo systemctl start "user@$(id -u).service"
          export GATOR_TEST_BINARY="$RUNNER_TEMP/gator-companion-runtime"
          go build -o "$GATOR_TEST_BINARY" ./cmd/gator
          GATOR_COMPANION_SYSTEMD_TEST=1 node --test companion/linux-service.test.mjs companion/linux-monitoring.test.mjs
      - name: Check unattended companion and supervisor startup
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: python3 scripts/companion-boot/run.py "$RUNNER_TEMP/gator-companion-runtime" "$RUNNER_TEMP/gator-companion-boot"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: companion-boot-evidence
          path: ${{ runner.temp }}/gator-companion-boot/
          if-no-files-found: ignore
      - name: Check browser journeys and credential forms
        if: runner.os == 'Linux'
        env:
          GATOR_COMPANION_BROWSERS: chromium,webkit
        run: |
          npm exec --prefix desktop -- playwright install --with-deps chromium webkit
          node --test companion/client.test.mjs
          GATOR_PANEL_BROWSER=1 node --test desktop/tests/panel-secrets.test.mjs
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Install strict process sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Test
        run: go test ./...
      - name: Race-check Work lifecycle
        if: runner.os == 'Linux'
        run: go test -race ./internal/agent ./internal/orchestrator ./internal/workrun ./internal/worksession ./internal/jobs ./internal/workapp ./internal/telemetry ./cmd/gator
      - name: Vet
        run: go vet ./...
      - name: Build
        run: make build

      - name: Check packaged desktop workflows
        if: runner.os == 'macOS'
        run: |
          npm run pack --prefix desktop
          GATOR_DESKTOP_TEST_EXECUTABLE="$PWD/desktop/release/mac/Gator.app/Contents/MacOS/Gator" npm run test:e2e --prefix desktop

  office:
    name: Office packages, calculations and layout
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.427"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Generate representative new and edited Office files
        run: go run ./scripts/office-fixtures .gator/office-fixtures
      - name: Roundtrip all three formats through the shared file editor
        run: |
          npm ci --prefix app-host
          node scripts/office-validation/roundtrip.mjs .gator/office-fixtures
      - name: Validate with the independent Open XML SDK
        run: |
          dotnet restore scripts/office-validation/OfficeValidation.csproj --locked-mode
          dotnet run --no-restore --project scripts/office-validation -- .gator/office-fixtures/*.pptx .gator/office-fixtures/*.docx .gator/office-fixtures/*.xlsx
      - name: Install independent Office renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer libreoffice-impress poppler-utils fonts-liberation fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji fonts-crosextra-carlito
      - name: Recalculate spreadsheets with LibreOffice Calc
        run: python3 scripts/office-validation/recalculate.py .gator/office-fixtures .gator/office-calculated
      - uses: actions/upload-artifact@v4
        with:
          name: office-calculation-evidence
          path: |
            .gator/office-calculated/calculation-report.json
            .gator/office-calculated/*.xlsx
      - name: Render Word and PowerPoint layouts independently
        run: python3 scripts/office-validation/render.py .gator/office-fixtures .gator/office-rendered
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-layout-evidence
          path: .gator/office-rendered/
          if-no-files-found: ignore

  browser:
    name: browser-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GATOR_BROWSER_INTEGRATION_STATE_DIR: ${{ runner.temp }}/gator-browser-integration
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Test pinned Chromium browser controller
        env:
          GATOR_BROWSER_INTEGRATION: "1"
        run: go test -count=1 -run TestSidecarManagedBrowserIntegration ./internal/browser
      - name: Test browser interruption, revocation and native cleanup
        run: go test -count=1 -timeout=3m -run 'TestSidecar(Cancellation|Close|Frozen|Stalled|DaemonCrash)|TestControllerLease|TestDuplicateController|TestService|TestWindows' ./internal/browser

  windows:
    name: Windows desktop preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Use canonical temporary paths for native fixtures
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'gator-native-tests'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $canonical = node -e "process.stdout.write(require('node:fs').realpathSync.native(process.argv[1]))" $directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TEMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile all Windows tests
        run: go test ./... -run '^$'
      - name: Test native Windows portability and private data
        run: |
          go test ./internal/filelock ./internal/privatefs ./internal/usage ./internal/hostproc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./cmd/gator -run 'TestWindows|TestDesktopRuntime|TestDesktopUpdate|TestUIBridgeUpdate|TestSupportedPlatforms'
          go test ./internal/workapp -run 'TestRestartReadiness'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/lifecycle -run 'TestPublishProfile|TestProfilePublication|TestRestore|TestEmptyBackup|TestSourceRelink|TestRelink'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/browser -run 'TestService|TestWindows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/localmodel -run 'TestWindows|TestAssess|TestFormatBytes'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/workspace -run 'TestWindows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/sandbox -run 'TestWindows'
      - name: Vet Windows source
        run: go vet ./...
      - name: Check desktop frontend and host
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix app-host
          npm ci --prefix desktop
          npm run check --prefix desktop
          npm test --prefix desktop
          node --test scripts/google-oauth-build.test.mjs
          node --test companion/auth.test.mjs companion/server.test.mjs companion/macos-service.test.mjs companion/linux-service.test.mjs companion/health.test.mjs
      - name: Package Windows x64 and verify native app workflows
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          npm run pack --prefix desktop
          export GATOR_DESKTOP_TEST_EXECUTABLE="$(cygpath -w "$PWD/desktop/release/win-unpacked/Gator.exe")"
          npm run test:e2e --prefix desktop
      - name: Build Windows ARM64 runtime
        shell: bash
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/gator-runtime-arm64.exe" ./cmd/gator
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-desktop-failures
          path: |
            desktop/test-results/
            desktop/playwright-report/
