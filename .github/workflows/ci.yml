name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check terminal UI bundle
        shell: bash
        run: |
          npm ci --prefix ui
          npm run check --prefix ui
          npm run build --prefix ui
          git diff --exit-code -- cmd/gator/ui/gator-ui.cjs
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Install strict process sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Test
        run: go test ./...
      - name: Race-check Work lifecycle
        if: runner.os == 'Linux'
        run: go test -race ./internal/agent ./internal/orchestrator ./internal/workrun ./internal/worksession ./internal/jobs ./internal/worktui ./internal/telemetry ./cmd/gator
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/gator

  browser:
    name: browser-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Test pinned Chromium browser controller
        env:
          GATOR_BROWSER_INTEGRATION: "1"
        run: go test -count=1 -run TestSidecarManagedBrowserIntegration ./internal/browser
