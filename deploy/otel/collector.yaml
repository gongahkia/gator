receivers:
  otlp:
    protocols:
      http:
  prometheus:
    config:
      scrape_configs:
        - job_name: norbot
          static_configs:
            - targets: ["norbot:8080"]
exporters:
  debug:
    verbosity: basic
  otlp/jaeger:
    endpoint: jaeger:4318
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [prometheus]
      exporters: [debug, prometheus]
