groups:
  - name: norbot
    rules:
      - alert: NorbotOutboxDeadLetter
        expr: norbot_operational_gauge{kind="outbox_dead"} > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Norbot has dead-lettered outbox events"
          runbook: "Inspect /api/operations/outbox/dead, record replay reason, then replay only understood failures."
      - alert: NorbotQueueLag
        expr: norbot_operational_gauge{kind="queue_depth"} > 0 and increase(norbot_stage_runs_total{outcome="completed"}[15m]) == 0
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Norbot queue has no observed stage completion"
      - alert: NorbotApprovalsAwaiting
        expr: norbot_operational_gauge{kind="pending_approvals"} > 0
        for: 24h
        labels: {severity: ticket}
        annotations:
          summary: "Norbot approvals have been pending for 24 hours"
      - alert: NorbotWorkspaceRecoveryRequired
        expr: norbot_operational_gauge{kind="workspace_failures"} > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Norbot workspace provisioning needs recovery"
      - alert: NorbotDeploymentFailed
        expr: norbot_operational_gauge{kind="deployments_failed"} > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Norbot has a failed current deployment"
      - alert: NorbotProviderRateLimited
        expr: norbot_operational_gauge{kind="provider_rate_limited_1h"} > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "A Norbot provider returned HTTP 429 in the last hour"
      - alert: NorbotVerificationCacheMissRate
        expr: sum(rate(norbot_verification_cache_access_total{outcome="miss"}[15m])) / clamp_min(sum(rate(norbot_verification_cache_access_total[15m])), 1) > 0.80
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "Norbot verification cache miss rate exceeds 80 percent"
