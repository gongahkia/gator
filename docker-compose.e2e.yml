services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: norbot
      POSTGRES_PASSWORD: norbot
      POSTGRES_DB: norbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norbot -d norbot"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports: ["127.0.0.1:55432:5432"]
