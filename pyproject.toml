[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hot-cross-buns"
version = "0.2.0"
description = "A local-first terminal client for tasks and calendars"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.0",
  "textual",
  "typer",
  "rich",
  "platformdirs",
  "keyring",
  "google-auth",
  "google-auth-oauthlib",
  "google-api-python-client",
  "python-dateutil>=2.9.0.post0",
]

[project.scripts]
hcb = "hcb.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "jsonschema", "types-python-dateutil"]

[tool.hatch.build.targets.wheel]
packages = ["src/hcb"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/hcb",
  "/tests",
  "/tools/benchmark_python.py",
  "/tools/benchmark_outbox.py",
  "/tools/calendar_mouse_smoke.py",
  "/docs/testing/local-tui-smoke.md",
  "/docs/testing/live-google-tui-smoke.md",
  "/docs/installation.md",
  "/docs/hcb-cli.md",
  "/docs/architecture/ghostty-bundled-themes.md",
  "/docs/architecture/ghostty-bundled-themes.md",
  "/scripts/install-hcb.py",
  "/packaging/macos/install-hcb.sh",
  "/packaging/macos/README.md",
  "/pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hcb"]
