services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: norbot
      POSTGRES_PASSWORD: norbot
      POSTGRES_DB: norbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norbot -d norbot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  norbot:
    build: .
    env_file: .env
    environment:
      NORBOT_DATABASE_URL: ${NORBOT_DATABASE_URL:-postgres://norbot:norbot@postgres:5432/norbot?sslmode=disable}
      NORBOT_HTTP_ADDR: ${NORBOT_HTTP_ADDR:-0.0.0.0:8080}
      NORBOT_ARTIFACTS_DIR: ${NORBOT_ARTIFACTS_DIR:-/var/lib/norbot/artifacts}
      NORBOT_CONFIG: /etc/norbot/config.json
      NORBOT_OTEL_ENDPOINT: ${NORBOT_OTEL_ENDPOINT:-otel-collector:4318}
      NORBOT_WORKERS: ${NORBOT_WORKERS:-2}
      NORBOT_MAX_WORKERS: ${NORBOT_MAX_WORKERS:-4}
      NORBOT_EGRESS_PROXY_SECRET: ${NORBOT_EGRESS_PROXY_SECRET:-}
      NORBOT_S3_ACCESS_KEY: ${NORBOT_S3_ACCESS_KEY:-}
      NORBOT_S3_SECRET_KEY: ${NORBOT_S3_SECRET_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NORBOT_CONFIG_HOST:-./config.json}:/etc/norbot/config.json:ro
      - ${NORBOT_KUBECONFIG_HOST:-./deploy/empty-kubeconfig}:/etc/norbot/kubeconfig:ro
      - norbot_artifacts:/var/lib/norbot/artifacts
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8181:8181"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  caddy:
    image: caddy:2.10-alpine
    profiles: ["public"]
    environment:
      NORBOT_PUBLIC_HTTPS_DOMAIN: ${NORBOT_PUBLIC_HTTPS_DOMAIN:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      norbot:
        condition: service_started

volumes:
  postgres_data:
  norbot_artifacts:
  caddy_data:
  caddy_config:
