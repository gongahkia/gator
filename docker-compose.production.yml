services:
  postgres:
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    image: norbot-postgres-pitr:16
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - archive_command=/usr/local/bin/norbot-archive-wal %p %f
    environment:
      NORBOT_BACKUP_PASSPHRASE: ${NORBOT_BACKUP_PASSPHRASE:?set a backup encryption passphrase}
      NORBOT_WAL_ARCHIVE_DIR: /var/lib/postgresql/wal-archive
      GNUPGHOME: /tmp/norbot-gnupg
    volumes:
      - ./deploy/postgres/norbot-archive-wal:/usr/local/bin/norbot-archive-wal:ro
      - ${NORBOT_WAL_ARCHIVE_HOST_DIR:?set an encrypted independent WAL archive directory}:/var/lib/postgresql/wal-archive
  norbot:
    environment:
      NORBOT_ALLOW_UNAUTHENTICATED_LOCAL: "false"
      NORBOT_METRICS_TOKEN: ${NORBOT_METRICS_TOKEN:?set a metrics bearer-equivalent secret}
