# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: paw

builds:
  - id: paw
    main: .
    binary: paw
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/gongahkia/paw/cmd.version={{ .Version }} -X github.com/gongahkia/paw/cmd.gitCommit={{ .ShortCommit }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: paw
    ids:
      - paw
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - id: paw
    artifacts: archive
    ids:
      - paw
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
      - "--enrich"
      - "all"
    disable: false

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - paw
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

snapshot:
  version_template: "{{ incpatch .Version }}-next"
